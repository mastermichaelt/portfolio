name: Renovate

on:
  schedule:
    # Sunday 13:17 UTC (off the hour) — Monday 00:17 AEDT. GitHub’s scheduled
    # workflow runner is often 2.5–5+ hours late on Sunday cron; starting earlier
    # still finishes before renovate.json lockFileMaintenance (before 12pm Monday)
    # and the owner’s Monday morning review even with ~5h delay.
    - cron: "17 13 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
