name: Renovate

on:
  schedule:
    # Sunday 13:15 UTC (off the hour) — Monday 00:15 AEDT. GitHub’s scheduled
    # workflow runner is often 2.5–5+ hours late on Sunday cron; starting earlier
    # still finishes before renovate.json lockFileMaintenance (before 12pm Monday)
    # and the owner’s Monday morning review even with ~5h delay.
    - cron: "15 13 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
