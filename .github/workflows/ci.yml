name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v5

      # Path-aware gate (codenames / resumes pattern): job always reports a status
      # (required-check safe). Skip Playwright only when the PR touches no
      # runtime-impacting paths (docs / .cursor / AGENTS / README, etc.).
      - name: Determine e2e profile
        id: profile
        run: |
          set -euo pipefail

          is_runtime_impacting() {
            local file="$1"
            case "$file" in
              app/*|components/*|content/*|domain/*|repositories/*|lib/*|public/*|e2e/*|tests/*)
                return 0
                ;;
              .github/*|.husky/*)
                return 0
                ;;
              package.json|package-lock.json|.nvmrc|.prettierrc|.prettierignore)
                return 0
                ;;
              next.config.*|playwright.config.*|vitest.config.*|eslint.config.*|postcss.config.*|tsconfig*.json|next-env.d.ts)
                return 0
                ;;
            esac
            return 1
          }

          run=true
          reason="run e2e"

          if [ "${{ github.event_name }}" = "push" ]; then
            run=true
            reason="main push (trusted gate)"
          else
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            # Fail closed (keep run=true) if fetch/diff cannot classify the PR.
            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              run=true
              reason="fail-closed: missing PR base or head SHA"
            elif ! git fetch origin "$base_sha" --depth=1; then
              run=true
              reason="fail-closed: git fetch failed for base SHA $base_sha"
            elif ! git fetch origin "$head_sha" --depth=1; then
              run=true
              reason="fail-closed: git fetch failed for head SHA $head_sha"
            else
              # Two-point diff between PR event SHAs — shallow-safe (no merge-base lookup).
              classified=false
              changed_files="$(git diff --name-only "$base_sha" "$head_sha")" || {
                run=true
                reason="fail-closed: git diff failed"
                classified=true
              }
              if [ "$classified" = false ]; then
                if [ -z "$changed_files" ]; then
                  run=true
                  reason="fail-closed: empty diff output"
                else
                  run=false
                  reason="docs-only PR (skip Playwright)"
                  while IFS= read -r file; do
                    [ -z "$file" ] && continue
                    if is_runtime_impacting "$file"; then
                      run=true
                      reason="runtime-impacting path: $file"
                      break
                    fi
                  done <<< "$changed_files"
                fi
              fi
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "E2E profile: run=$run ($reason)"

      - uses: actions/setup-node@v5
        if: steps.profile.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.profile.outputs.run == 'true'
        run: npm ci

      - if: steps.profile.outputs.run == 'true'
        run: npm run build

      - if: steps.profile.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.profile.outputs.run == 'true'
        run: npm run test:e2e

      - if: failure() && steps.profile.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
